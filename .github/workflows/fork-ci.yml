# Fork CI — the checks this fork's own changes can actually break.
#
# Upstream's ci.yml is disabled here (`gh workflow disable "CI"`) rather than
# edited, so merges from getpaseo:main never conflict over it. Re-enable it with
# `gh workflow enable "CI"` for a full 18-job run when that is worth 25 minutes.
#
# Transitional checks for the remaining fork core and image changes. External plugin
# tests, including the FigCraft contract, run in the plugin repository.
#
# Deliberately not covered:
#   playwright        browser E2E of packages/app — 4 shards x ~22 min, and each
#                     shard re-pays the full build + agent-CLI install.
#   desktop-tests     packages/desktop — untouched here
#   relay-tests       packages/relay — the relay is not deployed
#   cli/app/sdk       beyond ScriptFrame and the fork variant, untouched here
#   server-tests on windows  the deploy target is arm64 linux; this also carries
#                     a known flake in workspace-git-service.observation.test.ts
#
# The image build itself is covered by docker.yml, which is the real integration
# test: it runs npm ci and packs every workspace.
name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Unlike upstream, cancel superseded runs on push too. Upstream sets this to
# pull_request-only, which left a push-triggered run queued behind a stale one
# and made CI look hung.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs
      - name: Typecheck all packages
        run: npm run typecheck

  server-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # Full history: the worktree tests resolve refs against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Fetch origin/main (worktree tests)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai
      - name: Build server dependencies
        run: npm run build:server-deps
      # These secrets are absent on this fork. The suite skips the paths that
      # need them rather than failing — verified green on a full upstream-CI run.
      - name: Run server tests
        run: npm run test --workspace=@getpaseo/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Run built-in plugin tests
        run: npm run test --workspace=@getpaseo/builtin-plugins
  # The app's ScriptFrame and fork-variant unit tests. The built-in plugins run in server-tests; these are the only fork-authored
  # tests outside it.
  session-move-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Run app ScriptFrame and fork-variant tests
        working-directory: packages/app
        run: npx vitest run src/plugins/react-native/script-frame-page.test.ts src/plugins/react-native/script-frame.native.test.tsx src/plugins/evaluate.test.ts app.config.test.ts

  # ScriptFrame's web test, which needs Chromium.
  session-move-e2e:
    # The locked Playwright installers do not support ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browser
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Build server stack
        run: npm run build:server
      - name: Build native app dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio
      - name: Run ScriptFrame's web test
        working-directory: packages/app
        run: npx vitest run --project browser src/plugins/react-native/script-frame.web.browser.test.tsx

  # docker/** is most of this fork, and its scripts and compose files are
  # covered only by this node:test suite. It needs no npm install. Without it a
  # change to the browser's healthcheck or session scripts merges untested, and
  # every instance auto-deploys from main. The APK workflow's steps are tested
  # here too (scripts/fork-android-apk.test.mjs).
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run docker and APK workflow script tests
        run: node --test scripts/vpn-overlay.test.mjs scripts/fork-android-apk.test.mjs
