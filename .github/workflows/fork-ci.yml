# Fork CI — the checks this fork's own changes can actually break.
#
# Upstream's ci.yml is disabled here (`gh workflow disable "CI"`) rather than
# edited, so merges from getpaseo:main never conflict over it. Re-enable it with
# `gh workflow enable "CI"` for a full 18-job run when that is worth 25 minutes.
#
# This fork changes docker/**, built-in usage-source plugins in plugins/ (kiro,
# bddevlab, claude) and session move, which spans the server, the CLI and
# packages/app/src/session-move. Upstream already proves the rest of the app,
# desktop, relay, CLI and SDK on its own runs, so re-testing them here buys
# nothing and costs ~145 runner-minutes. The seven jobs below are the ones that
# can actually catch a fork-authored mistake.
#
# Deliberately not covered:
#   playwright        browser E2E of packages/app — 4 shards x ~22 min, and each
#                     shard re-pays the full build + agent-CLI install. The one
#                     journey this fork owns runs alone in session-move-e2e.
#   desktop-tests     packages/desktop — untouched here
#   relay-tests       packages/relay — the relay is not deployed
#   cli/app/sdk       beyond session move, untouched here
#   server-tests on windows  the deploy target is arm64 linux; this also carries
#                     a known flake in workspace-git-service.observation.test.ts
#
# The image build itself is covered by docker.yml, which is the real integration
# test: it runs npm ci and packs every workspace.
name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Unlike upstream, cancel superseded runs on push too. Upstream sets this to
# pull_request-only, which left a push-triggered run queued behind a stale one
# and made CI look hung.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs
      - name: Typecheck all packages
        run: npm run typecheck

  server-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # Full history: the worktree tests resolve refs against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Fetch origin/main (worktree tests)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai
      - name: Build server dependencies
        run: npm run build:server-deps
      # These secrets are absent on this fork. The suite skips the paths that
      # need them rather than failing — verified green on a full upstream-CI run.
      - name: Run server tests
        run: npm run test --workspace=@getpaseo/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Run built-in plugin tests
        run: npm run test --workspace=@getpaseo/builtin-plugins

  # Session move's app and CLI tests. The server half runs in server-tests;
  # these are the only fork-authored tests outside it.
  session-move-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server
      - name: Run app session-move tests
        working-directory: packages/app
        run: npx vitest run src/session-move src/screens/workspace/workspace-tab-menu.test.ts
      - name: Run CLI move tests
        working-directory: packages/cli
        run: npx vitest run src/commands/agent/move.test.ts

  # The move dialog, the tab swap and the move-back banner in a real browser, against
  # a real daemon. One spec: a build and about a minute of test time, with no agent CLIs.
  session-move-e2e:
    # The locked Playwright installers do not support ubuntu-latest's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browser
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Build server stack
        run: npm run build:server
      - name: Build native app dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio
      - name: Run the session move journey
        run: npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/session-move.spec.ts
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-move-e2e-results
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  # docker/** is most of this fork, and its scripts and compose files are
  # covered only by this node:test suite. It needs no npm install. Without it a
  # change to the browser's healthcheck or session scripts merges untested, and
  # every instance auto-deploys from main.
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run docker script and compose tests
        run: node --test scripts/vpn-overlay.test.mjs
